<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>Jobbautomatisering 2025–2050 – simulering</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 32px 8px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    padding: 16px 32px;
    background: var(--panel);
    border-top: 1px solid #222a33;
    border-bottom: 1px solid #222a33;
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 200px;
  }
  .control label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .control .value {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }
  input[type="range"] { width: 280px; }
  select {
    background: #0f1419;
    color: var(--text);
    border: 1px solid #2d3540;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 14px;
  }
  #map-container {
    position: relative;
    width: 100%;
    height: calc(100vh - 220px);
    min-height: 500px;
  }
  svg { width: 100%; height: 100%; display: block; }
  .country {
    stroke: #0f1419;
    stroke-width: 0.4px;
    transition: opacity 0.15s;
    cursor: pointer;
  }
  .country:hover { opacity: 0.75; stroke: #fff; stroke-width: 1px; }
  .country.no-data { fill: #2a313a; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15, 20, 25, 0.95);
    border: 1px solid #2d3540;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.1s;
    min-width: 180px;
  }
  #tooltip .name { font-weight: 600; margin-bottom: 4px; }
  #tooltip .stat { color: var(--muted); font-size: 12px; }
  #tooltip .pct {
    font-size: 22px;
    font-weight: 700;
    margin: 6px 0;
  }
  .legend {
    position: absolute;
    bottom: 20px;
    left: 32px;
    background: rgba(15, 20, 25, 0.85);
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid #2d3540;
  }
  .legend-title { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .legend-scale { display: flex; align-items: center; gap: 8px; }
  .legend-gradient {
    width: 220px;
    height: 12px;
    background: linear-gradient(to right, #1a6e3a, #4caf50, #ffd54f, #ff9800, #e53935, #8b0000);
    border-radius: 2px;
  }
  .legend-ticks {
    display: flex;
    justify-content: space-between;
    width: 220px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .scenario-note {
    font-size: 12px;
    color: var(--muted);
    max-width: 380px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<header>
  <h1>Världen 2025–2050: andel jobb under automatiseringstryck</h1>
  <div class="sub">Scenariosimulering. Färgen visar hur stor del av sysselsättningen som beräknas kunna utföras av AI/robotar.</div>
</header>

<div class="controls">
  <div class="control">
    <label>År</label>
    <input type="range" id="year" min="2025" max="2050" step="1" value="2025" />
    <div class="value"><span id="year-label">2025</span></div>
  </div>
  <div class="control">
    <label>Scenario</label>
    <select id="scenario">
      <option value="slow">Långsam adoption (regleringstung)</option>
      <option value="moderate" selected>Måttlig adoption (basscenario)</option>
      <option value="fast">Snabb adoption (AGI-genombrott)</option>
    </select>
    <div class="scenario-note" id="scenario-note"></div>
  </div>
  <div class="control" style="margin-left: auto;">
    <label>Världsgenomsnitt</label>
    <div class="value"><span id="world-avg">—</span>%</div>
  </div>
</div>

<div id="map-container">
  <svg id="map"></svg>
  <div id="tooltip"></div>
  <div class="legend">
    <div class="legend-title">Andel jobb under automatiseringstryck</div>
    <div class="legend-gradient"></div>
    <div class="legend-ticks">
      <span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span>
    </div>
  </div>
</div>

const scenarios = {
  slow: {
    multiplier: 0.55,
    startYear: 2025,
    note: "Stark reglering, långsam AI-integration, fokus på arbetstagarskydd."
  },
  moderate: {
    multiplier: 1.0,
    startYear: 2025,
    note: "Linjär utveckling utifrån dagens trender och kapitalinvesteringar."
  },
  fast: {
    multiplier: 1.35,
    startYear: 2025,
    note: "AGI-liknande genombrott före 2035, snabb robotutbyggnad globalt."
  }
};

function riskAt(country, year, scenarioKey) {
  if (!country || country.v === 0) return null;
  const s = scenarios[scenarioKey];
  const t = Math.max(0, Math.min(1, (year - 2025) / 25));
  const eased = Math.pow(t, 1.4);
  const projected = country.v * s.multiplier * eased;
  return Math.min(95, projected);
}

const colorScale = d3.scaleLinear()
  .domain([0, 15, 30, 45, 60, 80])
  .range(["#1a6e3a", "#4caf50", "#ffd54f", "#ff9800", "#e53935", "#8b0000"])
  .clamp(true);

const svg = d3.select("#map");
const tooltip = d3.select("#tooltip");
const yearInput = document.getElementById("year");
const yearLabel = document.getElementById("year-label");
const scenarioSelect = document.getElementById("scenario");
const scenarioNote = document.getElementById("scenario-note");
const worldAvgEl = document.getElementById("world-avg");

let currentYear = 2025;
let currentScenario = "moderate";
let countriesPath = null;
let geoFeatures = [];

const projection = d3.geoNaturalEarth1();
const path = d3.geoPath().projection(projection);

function resize() {
  const container = document.getElementById("map-container");
  const w = container.clientWidth;
  const h = container.clientHeight;
  svg.attr("viewBox", `0 0 ${w} ${h}`);
  projection.fitSize([w, h - 20], { type: "Sphere" });
  if (countriesPath) countriesPath.attr("d", path);
}

function update() {
  yearLabel.textContent = currentYear;
  scenarioNote.textContent = scenarios[currentScenario].note;

  let total = 0;
  let count = 0;
  geoFeatures.forEach(f => {
    const id = String(f.id).padStart(3, "0");
    const data = baseRisk2050[id];
    const r = data ? riskAt(data, currentYear, currentScenario) : null;
    if (r !== null) { total += r; count++; }
  });
  worldAvgEl.textContent = count ? (total / count).toFixed(1) : "—";

  if (!countriesPath) return;
  countriesPath
    .classed("no-data", d => {
      const id = String(d.id).padStart(3, "0");
      const data = baseRisk2050[id];
      return !data || data.v === 0;
    })
    .attr("fill", d => {
      const id = String(d.id).padStart(3, "0");
      const data = baseRisk2050[id];
      const r = data ? riskAt(data, currentYear, currentScenario) : null;
      return r === null ? "#2a313a" : colorScale(r);
    });
}

yearInput.addEventListener("input", e => {
  currentYear = +e.target.value;
  update();
});
scenarioSelect.addEventListener("change", e => {
  currentScenario = e.target.value;
  update();
});
window.addEventListener("resize", resize);

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(world => {
    geoFeatures = topojson.feature(world, world.objects.countries).features;
    countriesPath = svg.append("g")
      .selectAll("path")
      .data(geoFeatures)
      .join("path")
      .attr("class", "country")
      .on("mousemove", function(event, d) {
        const id = String(d.id).padStart(3, "0");
        const data = baseRisk2050[id];
        const r = data ? riskAt(data, currentYear, currentScenario) : null;
        const name = data ? data.name : (d.properties && d.properties.name) || "Okänt";
        tooltip
          .style("opacity", 1)
          .style("left", (event.offsetX + 18) + "px")
          .style("top", (event.offsetY + 18) + "px")
          .html(`
            <div class="name">${name}</div>
            <div class="pct" style="color:${r === null ? '#8b949e' : colorScale(r)}">
              ${r === null ? "Ingen data" : r.toFixed(1) + "%"}
            </div>
            <div class="stat">År ${currentYear} · ${scenarioSelect.options[scenarioSelect.selectedIndex].text}</div>
          `);
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));

    resize();
    update();
  })
  .catch(err => {
    document.getElementById("map-container").innerHTML =
      `<div style="padding:40px;color:#e53935">Kunde inte ladda världskartan: ${err.message}</div>`;
  });

</html>
