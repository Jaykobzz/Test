<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>Arbetssvärmen 2025–2050</title>
<style>
  :root {
    --bg: #07090d;
    --panel: rgba(16, 22, 30, 0.85);
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #1f2730;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #ui {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 360px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 14px 16px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.4; }
  .row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px;
  }
  button {
    background: #1f2933;
    color: var(--text);
    border: 1px solid #2d3540;
    border-radius: 5px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
  }
  button:hover { background: #2a3540; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover { background: #388bfd; }
  button.danger { background: #8b0000; border-color: #b00000; }
  button.danger:hover { background: #b00000; }
  select, input[type="range"] {
    background: #0f1419;
    color: var(--text);
    border: 1px solid #2d3540;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 13px;
  }
  input[type="range"] { padding: 0; flex: 1; }
  label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  #stats {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 10;
    min-width: 260px;
  }
  .big-stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid #1a2028;
  }
  .big-stat:last-child { border-bottom: none; }
  .big-stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .big-stat .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .year-display {
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  #legend {
    position: absolute;
    bottom: 16px; left: 16px;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 50vw;
  }
  .sector-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
  }
  .sector-chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .sector-chip .count {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  #event-log {
    position: absolute;
    bottom: 16px; right: 16px;
    z-index: 10;
    max-width: 320px;
    max-height: 200px;
    overflow: hidden;
    pointer-events: none;
  }
  .event {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 6px;
    animation: fade 8s forwards;
  }
  .event.bad { border-left-color: #e53935; }
  .event.good { border-left-color: #4caf50; }
  @keyframes fade {
    0% { opacity: 0; transform: translateX(20px); }
    8% { opacity: 1; transform: translateX(0); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(229,57,53,0.18), transparent 70%);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .flash.active { opacity: 1; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="flash" id="flash"></div>

<div id="ui">
  <div class="panel">
    <h1>Arbetssvärmen 2025–2050</h1>
    <div class="sub">10 000 arbetare. Varje prick är en människa. Färgen är deras sektor. När AI träffar blir de grå – och måste hitta nytt jobb.</div>
  </div>
  <div class="panel">
    <div class="row">
      <button id="play" class="primary">⏸ Pausa</button>
      <button id="reset">↻ Återställ</button>
    </div>
    <div class="row">
      <label style="min-width:60px">Hastighet</label>
      <input type="range" id="speed" min="0.2" max="6" step="0.1" value="1.5" />
      <span id="speed-label" style="font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)">1.5×</span>
    </div>
    <div class="row">
      <label style="min-width:60px">Scenario</label>
      <select id="scenario">
        <option value="slow">Långsam adoption</option>
        <option value="moderate" selected>Måttlig (basscenario)</option>
        <option value="fast">Snabb AI-revolution</option>
      </select>
    </div>
    <div class="row">
      <button id="shock" class="danger">⚡ Trigga AGI-genombrott</button>
    </div>
  </div>
</div>

<div id="stats" class="panel">
  <div class="year-display" id="year">2025</div>
  <div class="big-stat">
    <span class="label">Arbetslösa</span>
    <span class="num" id="unemployed" style="color:#e53935">0</span>
  </div>
  <div class="big-stat">
    <span class="label">Omskolade</span>
    <span class="num" id="retrained" style="color:#4caf50">0</span>
  </div>
  <div class="big-stat">
    <span class="label">AI-träffar / år</span>
    <span class="num" id="hit-rate" style="color:#ffb74d">0</span>
  </div>
  <div class="big-stat">
    <span class="label">Nya yrkesfält</span>
    <span class="num" id="new-sectors">0</span>
  </div>
</div>

<div id="legend"></div>
<div id="event-log"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// --- Sektorer ---
// risk = sannolikhet per "år" att en arbetare i sektorn träffas av AI
// (skalas med scenario-multiplier och tidsacceleration)
const SECTORS = [
  { id: "manuf",   name: "Industri & tillverkning", color: "#ff7043", risk: 0.85, anchor: [0.20, 0.30] },
  { id: "transp",  name: "Transport & logistik",    color: "#ffb74d", risk: 0.80, anchor: [0.35, 0.25] },
  { id: "retail",  name: "Handel & kassa",          color: "#ffd54f", risk: 0.75, anchor: [0.50, 0.30] },
  { id: "admin",   name: "Administration",          color: "#fff176", risk: 0.70, anchor: [0.65, 0.25] },
  { id: "finance", name: "Finans & bokföring",      color: "#aed581", risk: 0.60, anchor: [0.80, 0.30] },
  { id: "media",   name: "Media & kreativ",         color: "#4fc3f7", risk: 0.55, anchor: [0.20, 0.55] },
  { id: "tech",    name: "IT & utveckling",         color: "#7986cb", risk: 0.45, anchor: [0.35, 0.60] },
  { id: "edu",     name: "Utbildning",              color: "#9575cd", risk: 0.35, anchor: [0.50, 0.55] },
  { id: "health",  name: "Vård & omsorg",           color: "#f06292", risk: 0.20, anchor: [0.65, 0.60] },
  { id: "craft",   name: "Hantverk & service",      color: "#ba68c8", risk: 0.25, anchor: [0.80, 0.55] },
  { id: "ai_eng",  name: "AI-ingenjör",             color: "#00e5ff", risk: 0.05, anchor: [0.30, 0.82], emerging: true, emergesYear: 2026 },
  { id: "robo_op", name: "Robotunderhåll",          color: "#1de9b6", risk: 0.10, anchor: [0.50, 0.82], emerging: true, emergesYear: 2028 },
  { id: "ai_ethic",name: "AI-etiker",               color: "#ffea00", risk: 0.05, anchor: [0.70, 0.82], emerging: true, emergesYear: 2031 },
];
const SECTOR_BY_ID = Object.fromEntries(SECTORS.map(s => [s.id, s]));
const UNEMPLOYED_COLOR = "#4a5560";

const SCENARIOS = {
  slow:     { mult: 0.55, retrainBoost: 1.3, label: "Långsam adoption" },
  moderate: { mult: 1.00, retrainBoost: 1.0, label: "Måttlig (basscenario)" },
  fast:     { mult: 1.70, retrainBoost: 0.8, label: "Snabb AI-revolution" },
};

const AGENT_COUNT = 10000;
const agents = [];

function initialSectorDistribution() {
  // Ungefärlig global sysselsättningsfördelning per startsektor.
  const dist = [
    ["manuf",   0.18],
    ["transp",  0.07],
    ["retail",  0.14],
    ["admin",   0.10],
    ["finance", 0.05],
    ["media",   0.04],
    ["tech",    0.05],
    ["edu",     0.07],
    ["health",  0.13],
    ["craft",   0.17],
  ];
  const arr = [];
  for (const [id, p] of dist) {
    const n = Math.round(AGENT_COUNT * p);
    for (let i = 0; i < n; i++) arr.push(id);
  }
  while (arr.length < AGENT_COUNT) arr.push("craft");
  return arr;
}

function spawnAgents() {
  agents.length = 0;
  const dist = initialSectorDistribution();
  for (let i = 0; i < AGENT_COUNT; i++) {
    const sid = dist[i];
    const s = SECTOR_BY_ID[sid];
    agents.push({
      sector: sid,
      x: s.anchor[0] * W + (Math.random() - 0.5) * 80,
      y: s.anchor[1] * H + (Math.random() - 0.5) * 80,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      state: "employed", // employed | unemployed | retraining
      retrainProgress: 0,
      targetSector: null,
      age: 25 + Math.random() * 40,
    });
  }
}
spawnAgents();

// --- Tillstånd ---
let year = 2025;
let yearFrac = 0;
let playing = true;
let speed = 1.5;
let scenarioKey = "moderate";
let shockActive = false;
let shockDecay = 0;
let totalHitsThisYear = 0;
let lastYearHits = 0;
let totalRetrained = 0;
let activeSectorIds = new Set(SECTORS.filter(s => !s.emerging).map(s => s.id));

// --- UI ---
const playBtn = document.getElementById("play");
const resetBtn = document.getElementById("reset");
const speedInput = document.getElementById("speed");
const speedLabel = document.getElementById("speed-label");
const scenarioSelect = document.getElementById("scenario");
const shockBtn = document.getElementById("shock");
const yearEl = document.getElementById("year");
const unemployedEl = document.getElementById("unemployed");
const retrainedEl = document.getElementById("retrained");
const hitRateEl = document.getElementById("hit-rate");
const newSectorsEl = document.getElementById("new-sectors");
const legendEl = document.getElementById("legend");
const eventLog = document.getElementById("event-log");
const flash = document.getElementById("flash");

playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "⏸ Pausa" : "▶ Spela";
});
resetBtn.addEventListener("click", () => {
  year = 2025; yearFrac = 0;
  totalHitsThisYear = 0; lastYearHits = 0; totalRetrained = 0;
  activeSectorIds = new Set(SECTORS.filter(s => !s.emerging).map(s => s.id));
  spawnAgents();
  buildLegend();
  logEvent("Simuleringen återställd", "good");
});
speedInput.addEventListener("input", e => {
  speed = +e.target.value;
  speedLabel.textContent = speed.toFixed(1) + "×";
});
scenarioSelect.addEventListener("change", e => {
  scenarioKey = e.target.value;
  logEvent(`Scenario: ${SCENARIOS[scenarioKey].label}`);
});
shockBtn.addEventListener("click", () => {
  shockActive = true;
  shockDecay = 3.0; // år
  flash.classList.add("active");
  logEvent("⚡ AGI-GENOMBROTT! Massiv automatiseringsvåg.", "bad");
  setTimeout(() => flash.classList.remove("active"), 600);
});

function buildLegend() {
  legendEl.innerHTML = "";
  SECTORS.forEach(s => {
    if (!activeSectorIds.has(s.id)) return;
    const chip = document.createElement("div");
    chip.className = "sector-chip";
    chip.innerHTML = `<div class="dot" style="background:${s.color}"></div><span>${s.name}</span><span class="count" id="count-${s.id}">0</span>`;
    legendEl.appendChild(chip);
  });
}
buildLegend();

function logEvent(msg, kind = "") {
  const e = document.createElement("div");
  e.className = "event " + kind;
  e.textContent = msg;
  eventLog.prepend(e);
  setTimeout(() => e.remove(), 8200);
}

// --- Simuleringssteg ---
function pickRetrainTarget() {
  // Lågriskssektorer + nya yrkesfält viktade efter låg risk.
  const candidates = SECTORS.filter(s => activeSectorIds.has(s.id) && s.risk < 0.5);
  if (!candidates.length) return null;
  const weights = candidates.map(s => 1 / (s.risk + 0.05));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < candidates.length; i++) {
    r -= weights[i];
    if (r <= 0) return candidates[i].id;
  }
  return candidates[0].id;
}

function step(dt) {
  // dt = år (delår)
  const scen = SCENARIOS[scenarioKey];
  const shockMult = shockActive ? 4.0 : 1.0;

  // Lansera nya sektorer när året passeras
  SECTORS.forEach(s => {
    if (s.emerging && !activeSectorIds.has(s.id) && year >= s.emergesYear) {
      activeSectorIds.add(s.id);
      buildLegend();
      logEvent(`Nytt yrkesfält: ${s.name}`, "good");
    }
  });

  // Decay för shock
  if (shockActive) {
    shockDecay -= dt;
    if (shockDecay <= 0) {
      shockActive = false;
      logEvent("Chockvågen klingar av");
    }
  }

  let hitsThisStep = 0;

  for (let i = 0; i < agents.length; i++) {
    const a = agents[i];

    // Rörelse mot sektorns ankarpunkt med lite brus
    let anchor;
    if (a.state === "unemployed") {
      anchor = [0.5, 0.9];
    } else if (a.state === "retraining") {
      const tgt = SECTOR_BY_ID[a.targetSector];
      anchor = tgt ? tgt.anchor : [0.5, 0.9];
    } else {
      const s = SECTOR_BY_ID[a.sector];
      anchor = s.anchor;
    }
    const tx = anchor[0] * W;
    const ty = anchor[1] * H;
    const dx = tx - a.x;
    const dy = ty - a.y;
    a.vx += dx * 0.00015 + (Math.random() - 0.5) * 0.04;
    a.vy += dy * 0.00015 + (Math.random() - 0.5) * 0.04;
    a.vx *= 0.94;
    a.vy *= 0.94;
    a.x += a.vx * speed;
    a.y += a.vy * speed;

    // AI-träff
    if (a.state === "employed") {
      const s = SECTOR_BY_ID[a.sector];
      const annualHitProb = s.risk * scen.mult * 0.025 * shockMult;
      const stepProb = annualHitProb * dt;
      if (Math.random() < stepProb) {
        a.state = "unemployed";
        a.retrainProgress = 0;
        hitsThisStep++;
      }
    } else if (a.state === "unemployed") {
      // Försök börja omskolning
      if (Math.random() < 0.4 * dt) {
        const t = pickRetrainTarget();
        if (t) {
          a.state = "retraining";
          a.targetSector = t;
          a.retrainProgress = 0;
        }
      }
    } else if (a.state === "retraining") {
      const retrainSpeed = 0.6 * scen.retrainBoost;
      a.retrainProgress += retrainSpeed * dt;
      if (a.retrainProgress >= 1) {
        a.sector = a.targetSector;
        a.targetSector = null;
        a.state = "employed";
        totalRetrained++;
      }
    }
  }

  totalHitsThisYear += hitsThisStep;
  yearFrac += dt;
  if (yearFrac >= 1) {
    lastYearHits = totalHitsThisYear;
    totalHitsThisYear = 0;
    yearFrac -= 1;
    year++;
    if (year > 2050) {
      playing = false;
      playBtn.textContent = "▶ Spela";
      logEvent("Simulering klar – år 2050", "good");
    }
  }
}

// --- Rendering ---
function render() {
  // Trail-effekt
  ctx.fillStyle = "rgba(7, 9, 13, 0.35)";
  ctx.fillRect(0, 0, W, H);

  // Rita arbetare
  for (let i = 0; i < agents.length; i++) {
    const a = agents[i];
    let color;
    if (a.state === "unemployed") {
      color = UNEMPLOYED_COLOR;
    } else if (a.state === "retraining") {
      const tgt = SECTOR_BY_ID[a.targetSector];
      const t = a.retrainProgress;
      color = tgt ? blend(UNEMPLOYED_COLOR, tgt.color, t) : UNEMPLOYED_COLOR;
    } else {
      color = SECTOR_BY_ID[a.sector].color;
    }
    ctx.fillStyle = color;
    ctx.fillRect(a.x, a.y, 2, 2);
  }
}

function blend(c1, c2, t) {
  const a = hex2rgb(c1), b = hex2rgb(c2);
  const r = Math.round(a[0] + (b[0] - a[0]) * t);
  const g = Math.round(a[1] + (b[1] - a[1]) * t);
  const bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return `rgb(${r},${g},${bl})`;
}
function hex2rgb(h) {
  const m = h.replace("#", "");
  return [parseInt(m.substr(0,2),16), parseInt(m.substr(2,2),16), parseInt(m.substr(4,2),16)];
}

// --- HUD ---
function updateHUD() {
  yearEl.textContent = year;
  let unemployed = 0;
  const counts = {};
  for (const s of SECTORS) counts[s.id] = 0;
  for (let i = 0; i < agents.length; i++) {
    const a = agents[i];
    if (a.state === "unemployed" || a.state === "retraining") unemployed++;
    else counts[a.sector]++;
  }
  unemployedEl.textContent = unemployed.toLocaleString("sv-SE");
  retrainedEl.textContent = totalRetrained.toLocaleString("sv-SE");
  hitRateEl.textContent = lastYearHits.toLocaleString("sv-SE");
  newSectorsEl.textContent = SECTORS.filter(s => s.emerging && activeSectorIds.has(s.id)).length;
  for (const s of SECTORS) {
    const el = document.getElementById("count-" + s.id);
    if (el) el.textContent = counts[s.id].toLocaleString("sv-SE");
  }
}

// --- Loop ---
let lastT = performance.now();
let hudAccum = 0;
function loop(now) {
  const realDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (playing && year <= 2050) {
    // 1 verklig sekund = ~0.5 simuleringsår vid 1× hastighet
    const simDt = realDt * 0.5 * speed;
    step(simDt);
  }
  render();
  hudAccum += realDt;
  if (hudAccum > 0.1) {
    updateHUD();
    hudAccum = 0;
  }
  requestAnimationFrame(loop);
}
ctx.fillStyle = "#07090d";
ctx.fillRect(0, 0, W, H);
updateHUD();
requestAnimationFrame(loop);

// Inledande events för dramaturgi
setTimeout(() => logEvent("Simulering startad. AI-press börjar byggas upp."), 300);
</script>
</body>
</html>
