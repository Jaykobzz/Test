<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B3541E; } a:hover { color: #8E4218; }
    .scr { width: 390px; height: 844px; background: #F7F5EF; overflow: hidden;
           font-family: "Hanken Grotesk", system-ui, sans-serif; color: #14201B; }
    .disp { font-family: "Unbounded", system-ui, sans-serif; font-weight: 600; }
    .pad { padding: 0 20px; }
    .card { background: #FFFFFF; border-radius: 18px; overflow: hidden;
            box-shadow: 0 1px 2px rgba(20,32,27,.05), 0 8px 20px rgba(20,32,27,.06); }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
             padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: .66px;
             text-transform: uppercase; }
    .meta { font-size: 13px; line-height: 18px; color: #56635C; }
  </style>
</helmet>

<div class="scr">

  <!-- Sidhuvud -->
  <div class="pad" style="display:flex; align-items:flex-start; justify-content:space-between; padding-top:64px; padding-bottom:16px">
    <div>
      <div class="disp" style="font-size:24px; line-height:32px">Upptäck</div>
      <div style="display:flex; align-items:center; gap:5px; margin-top:2px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#83908A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span style="font-size:13px; color:#83908A">Skarpnäck · 10 km</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px; background:#15604B; color:#fff;
                border-radius:999px; padding:10px 16px; font-size:15px; font-weight:700">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Lägg upp
    </div>
  </div>

  <!-- Spontant, överst för att det är färskvara -->
  <div class="pad" style="padding-bottom:10px">
    <div style="display:flex; align-items:center; gap:7px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3541E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></svg>
      <span style="font-size:11px; font-weight:700; letter-spacing:.66px; text-transform:uppercase; color:#B3541E">Händer snart</span>
    </div>
  </div>

  <div class="pad" style="padding-bottom:16px">
    <div class="card">
      <!-- Ritat omslag: spontana poster har ingen bild -->
      <div style="height:132px; background:#1D5B6E; display:flex; align-items:center; justify-content:center; position:relative">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#F7F5EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.42"><path d="M4 8h11v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M15 9h2.5a2.5 2.5 0 0 1 0 5H15"/><path d="M6 3.5v2M9.5 3.5v2M13 3.5v2"/></svg>
        <div style="position:absolute; top:12px; left:12px; display:flex; gap:6px">
          <span class="badge" style="background:#B3541E; color:#fff">Spontant</span>
        </div>
        <div style="position:absolute; top:12px; right:12px">
          <span class="badge" style="background:rgba(12,14,18,.72); color:#fff">Om 25 min</span>
        </div>
      </div>
      <div style="padding:16px">
        <div class="disp" style="font-size:18px; line-height:24px">Ta en fika</div>
        <div class="meta" style="margin-top:4px">Skarpnäcks torg · 600 m</div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:12px">
          <div style="width:26px; height:26px; border-radius:999px; background:#D9EBE2; color:#0D4A39;
                      display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700">EA</div>
          <span class="meta">Elin · 2 platser kvar</span>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" style="padding-bottom:10px">
    <span style="font-size:11px; font-weight:700; letter-spacing:.66px; text-transform:uppercase; color:#83908A">Planerat</span>
  </div>

  <!-- Planerad aktivitet, med foto -->
  <div class="pad">
    <div class="card">
      <div style="height:172px; position:relative;
                  background:linear-gradient(160deg,#5B6E63 0%,#2F3F38 55%,#1B2620 100%)">
        <!-- brygga och vatten, antytt -->
        <div style="position:absolute; inset:auto 0 0 0; height:62px; background:linear-gradient(180deg,rgba(120,140,150,.35),rgba(40,55,60,.75))"></div>
        <div style="position:absolute; left:44%; bottom:0; width:64px; height:74px; background:rgba(90,72,52,.85); transform:skewX(-3deg)"></div>
        <div style="position:absolute; top:12px; left:12px">
          <span class="badge" style="background:rgba(12,14,18,.72); color:#fff">Din aktivitet</span>
        </div>
      </div>
      <div style="padding:16px">
        <div class="disp" style="font-size:18px; line-height:24px">Fiska i Drevviken</div>
        <div class="meta" style="margin-top:4px">Imorgon 13–15 · Drevviken · 1,2 km</div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px">
          <div style="display:flex; align-items:center; gap:8px">
            <div style="width:26px; height:26px; border-radius:999px; background:#D9EBE2; color:#0D4A39;
                        display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700">DU</div>
            <span class="meta">5 vill haka på</span>
          </div>
          <span class="badge" style="background:#D9EBE2; color:#0D4A39">Svara</span>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
